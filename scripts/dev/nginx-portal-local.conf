# Optional nginx vhost for local portal API (license E2E).
# Install:
#   sudo cp scripts/dev/nginx-portal-local.conf /etc/nginx/sites-available/toplist-portal-dev
#   sudo ln -sf /etc/nginx/sites-available/toplist-portal-local /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Set PORTAL_ROOT before copying if your portal checkout is not at the path below.

server {
    listen 127.0.0.1:9080;
    server_name localhost;
    root /home/user256/GitRepos/portal;
    index index.php;

    client_max_body_size 16m;

    location ~ ^/(api/config\.local\.php|\.env|\.git) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/api/v1/([a-z0-9-]+)(/.*)?$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api/v1/module-dispatch.php;
        fastcgi_param QUERY_STRING module=$1&path=$2;
        fastcgi_read_timeout 120;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    }
}
