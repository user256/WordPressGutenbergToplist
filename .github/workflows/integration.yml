name: Integration (wp-env)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'toplist-block/**'
      - 'tests/integration/**'
      - 'tests/IntegrationTestCase.php'
      - '.wp-env.json'
      - 'package.json'

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm install --no-fund --no-audit

      - name: Start wp-env and run integration tests
        run: npm run test:integration:setup && composer test:integration
